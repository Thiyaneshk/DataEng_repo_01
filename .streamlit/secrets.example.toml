# Copy this file to secrets.toml and fill in real secrets.

[google_auth]
enabled = true
client_id = "YOUR_GOOGLE_CLIENT_ID"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
redirect_uri = "http://localhost:8501"
cookie_key = "random_secret_cookie_key_123"
cookie_name = "google_auth_cookie"
cookie_expiry_days = 30

[db]
duckdb_path = "data/app.duckdb"
# Later: add postgres_url = "postgresql+psycopg2://user:pass@host:5432/dbname"
