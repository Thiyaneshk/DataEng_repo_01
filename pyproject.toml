[project]
name = "de_template"
version = "0.1.0"
description = "Data engineering template: Streamlit + uv + DuckDB (later Postgres, dbt, Airflow)"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.40.0,<2.0.0",
    "duckdb>=1.0.0,<2.0.0",
    "yfinance>=0.2.40,<1.0.0",
    "dbt-duckdb>=1.9.0,<2.0.0",
    "plotly>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# Explicitly include app and scripts as packages for Hatchling
[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
