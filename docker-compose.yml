services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  streamlit:
    build: .
    image: stock-ml:latest
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-Equity Data Platform}
      - DUCKDB_PATH=${DUCKDB_PATH:-data/app.duckdb}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/airflow}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./config:/app/config
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/main.py", "--server.enableCORS=false"]

  airflow:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      PYTHONPATH: /workspace
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/workspace
    ports:
      - "8080:8080"
    command: >
      bash -c "
      pip install -q duckdb yfinance dbt-duckdb sqlalchemy psycopg2-binary &&
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true &&
      airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
      - airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /workspace
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/workspace
    command: >
      bash -c "
      sleep 20 && \
      pip install -q duckdb yfinance dbt-duckdb sqlalchemy psycopg2-binary &&
      airflow scheduler"


volumes:
  postgres_data:
